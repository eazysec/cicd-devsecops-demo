name: Release

# The official release chain (brief §7 "Push / merge sur main"): Release Please proposes/cuts a
# SemVer release from Conventional Commits (D2); only once a release actually exists do we build
# ONE image, scan it, and promote that single digest through staging then production (Principle
# I — see docs/adr/0004-build-once-promote.md). A push that is not itself a release (e.g. a
# merged docs-only PR, which Release Please never bumps a version for) triggers nothing past the
# first job.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false # never cancel a release/deploy mid-flight

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    name: "Release Please"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-scan-publish:
    name: "Build Once + Scan + Publish"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      security-events: write # to upload the Trivy SARIF report to Code Scanning
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set build time
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Principle I: this is the ONLY build+push step in the entire repository. Every
      # deployment (staging and production) below reuses this step's digest — never rebuilt.
      - name: Build and push (build once)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.version }}
            GIT_SHA=${{ needs.release-please.outputs.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ needs.release-please.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ needs.release-please.outputs.sha }}

      - name: Trivy scan (full SARIF report, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          format: sarif
          output: trivy-results.sarif
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy SARIF report (build artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-results-${{ needs.release-please.outputs.version }}
          path: trivy-results.sarif
          retention-days: 30

      # Findings become persistent, triageable entries in the repo's Security tab (severity,
      # open/fixed/dismissed lifecycle) instead of only existing in a zip nobody opens unless
      # something already failed elsewhere — the actual gap flagged in docs/retex-webinar.md:
      # a scanner that runs but never surfaces its output anywhere a human would look is its
      # own kind of security theatre. Public-repo only for now — GitHub Code Scanning requires
      # the paid GitHub Code Security add-on for private repos (see SECURITY.md).
      - name: Upload Trivy SARIF report to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # Security Gate (D5 policy): only fixable HIGH/CRITICAL findings block promotion — see
      # docs/adr and research.md#d5-vulnerability-scanning-policy-trivy for why an unfixable or
      # newly-published CVE can never turn a previously-green pipeline red overnight.
      - name: Trivy scan (promotion gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          format: table
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  deploy-staging:
    name: "Deploy: staging"
    needs: [release-please, build-scan-publish]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    # A reusable workflow's own job permissions are capped by the CALLING job's permissions —
    # without this block, deploy.yml's request for id-token/deployments write is silently
    # downgraded to "none" (discovered via a real failed run: "is only allowed 'deployments:
    # none, id-token: none'"). Must mirror what deploy.yml's own job declares.
    permissions:
      id-token: write
      contents: read
      deployments: write
    with:
      environment: staging
      digest: ${{ needs.build-scan-publish.outputs.digest }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  deploy-production:
    name: "Deploy: production (promote same digest)"
    needs: [release-please, build-scan-publish, deploy-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
      deployments: write
    with:
      environment: production
      digest: ${{ needs.build-scan-publish.outputs.digest }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
