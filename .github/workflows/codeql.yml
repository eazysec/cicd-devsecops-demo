name: CodeQL

# Deliberately decoupled from pr-validation.yml's fast gate (ADR 0006/0007, docs/retex-webinar.md
# §1.4): Bandit is pattern-based and runs in seconds, so it blocks every PR for immediate
# feedback. CodeQL does dataflow/taint-tracking analysis — deeper, slower, and not something a
# developer should wait on mid-PR. It runs after a change has already landed on main, plus a
# weekly schedule to catch newly-published query packs against unchanged code — informational,
# feeds GitHub Code Scanning alongside Trivy, never blocks a merge.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL analysis (Python)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: codeql-python
